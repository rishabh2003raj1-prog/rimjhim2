name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      APP_PIN: ${{ secrets.APP_PIN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Create the D1 database if needed and deploy
        run: npm run deploy
      - name: Set the app PIN
        if: ${{ env.APP_PIN != '' }}
        run: echo "$APP_PIN" | npx wrangler secret put APP_PIN
      - name: Set the AI key (optional)
        if: ${{ env.ANTHROPIC_API_KEY != '' }}
        run: echo "$ANTHROPIC_API_KEY" | npx wrangler secret put ANTHROPIC_API_KEY
